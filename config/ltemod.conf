# =============================================================================
# ltemod.conf — центральный конфиг LTE-модема + WiFi роутера + Multi-VPN
# Orange Pi 3 LTS / Armbian + Sierra Wireless EM7565 (WS18-02 адаптер)
# =============================================================================

# --- Настройки модема ---
# APN вашего оператора (например: internet, internet.mts.ru, m.tele2.ru)
# Готовые значения для российских операторов: examples/operators/
APN="internet"

# Логин и пароль APN (большинство операторов не требуют — оставить пустыми)
# Билайн: APN_USER="beeline" APN_PASS="beeline" (если без авторизации не работает)
APN_USER=""
APN_PASS=""

# Автоопределение APN по SIM-карте: "yes" — определять при каждом подключении
# (detect-sim --get-apn вызывается из connect-modem.sh, перекрывает APN выше
# если оператор распознан; ручное APN служит резервом).
# "no" — использовать только значение APN выше.
APN_AUTO="yes"

# Протокол подключения: "mbim" (рекомендуется) или "qmi"
MODEM_PROTO="mbim"

# Устройство управления модемом (обычно определяется автоматически через udev)
MODEM_DEV="/dev/cdc-wdm0"

# Сетевой интерфейс LTE-модема (появляется после подключения)
# Может быть: wwan0, wwp0s20f0u2 и т.д. Проверить: ip link | grep ww
WWAN_IFACE="wwan0"

# Имя соединения в NetworkManager (не менять без необходимости)
NM_CON_NAME="lte-connection"

# USSD-код запроса баланса у оператора (sms.sh balance)
# Типичные: *100# (МТС/Tele2), *102# (Билайн), #100# (Мегафон)
USSD_BALANCE_CODE="*100#"

# --- Сетевые интерфейсы ---
# LAN интерфейс (Ethernet для локальной сети / uplink кабель)
# На Armbian/Orange Pi 3 LTS может быть: end0, eth0, enp2s0
# Проверить командой: ip link
LAN_IFACE="end0"

# --- Uplink приоритет ---
# Порядок проверки активного uplink-интерфейса (пробел-разделённый список)
# lte  = LTE-модем ($WWAN_IFACE)
# wifi = WiFi клиент ($WIFI_CLIENT_IFACE)
# eth  = Ethernet ($LAN_IFACE используется как uplink, когда WiFi AP выключена)
UPLINK_PRIORITY="lte wifi eth"

# --- WiFi точка доступа (AP) ---
# yes — включить WiFi AP при старте; no — не включать
WIFI_AP_ENABLED="yes"

# Физический WiFi интерфейс (на Orange Pi 3 LTS: wlan0)
WIFI_AP_IFACE="wlan0"

# Имя WiFi сети (SSID)
WIFI_AP_SSID="OrangePi-Router"

# Пароль WiFi (минимум 8 символов)
WIFI_AP_PASSWORD="changeme123"

# Диапазон: "2g" | "5g" | "both" (both = оба одновременно через виртуальный iface)
WIFI_AP_BAND="2g"

# Канал 2.4 GHz (1-13, рекомендуется: 1, 6 или 11)
WIFI_AP_CHANNEL_2G=6

# Канал 5 GHz (36, 40, 44, 48, 149, 153, 157, 161)
WIFI_AP_CHANNEL_5G=36

# IP роутера в AP сети (шлюз для WiFi клиентов)
WIFI_AP_IP="192.168.10.1"

# DHCP диапазон для WiFi клиентов
WIFI_AP_DHCP_RANGE="192.168.10.100,192.168.10.200,12h"

# --- Бридж LAN + WiFi AP ---
# yes — объединить wlan0 и end0 в один bridge (br0): кабельные и WiFi клиенты
#        оказываются в одной сети 192.168.10.0/24 и видят друг друга
# no  — end0 и wlan0 работают раздельно (поведение по умолчанию)
BRIDGE_LAN_ENABLED="no"

# Имя bridge-интерфейса
BRIDGE_IFACE="br0"

# --- WiFi клиент (upstream подключение) ---
# yes — подключаться к upstream WiFi роутеру; no — не подключаться
WIFI_CLIENT_ENABLED="no"

# Виртуальный интерфейс для клиентского подключения (создаётся автоматически)
WIFI_CLIENT_IFACE="wlan1"

# SSID upstream роутера
WIFI_CLIENT_SSID=""

# Пароль upstream роутера
WIFI_CLIENT_PASSWORD=""

# --- VPN ---
# Активный VPN протокол: "wg" | "amnezia" | "vless" | "none"
# "none" — VPN отключён, трафик идёт напрямую через LTE.
# Установить нужный протокол ПОСЛЕ настройки конфига VPN (setup-vpn / setup-amnezia / setup-vless).
# ltemod-vpn.service читает это значение при каждом старте системы.
VPN_PROTO="none"

# WireGuard
VPN_IFACE="wg0"
WG_CONFIG="/etc/wireguard/wg0.conf"

# AmneziaWG
AMNEZIA_IFACE="awg0"
AMNEZIA_CONFIG="/etc/amnezia/amneziawg/awg0.conf"

# VLESS (sing-box)
VLESS_CONFIG="/etc/sing-box/config.json"
VLESS_TUN_IFACE="tun0"

# --- Защита VPN (kill-switch + DNS) ---
# Kill-switch: если VPN-режим активен, но туннель упал — блокировать трафик
# клиентов (не выпускать в обход VPN). yes — включить защиту от утечки.
VPN_KILLSWITCH="no"

# Принудительный DNS: перехватывать DNS-запросы клиентов (порт 53) и направлять
# на роутер (dnsmasq → через туннель). Закрывает DNS-leak даже у клиентов с
# зашитыми публичными DNS. Включается вместе с kill-switch в VPN-режиме.
VPN_DNS_REDIRECT="yes"

# Каталог именованных VPN-профилей (vpn-profile add/use/list)
PROFILE_DIR="/etc/ltemod/profiles"

# --- Watchdog ---
# Хост для проверки интернет-соединения
PING_HOST="8.8.8.8"

# Максимальное количество попыток переподключения перед reboot
MAX_RECONNECT_ATTEMPTS=5

# Файл для хранения счётчика попыток (в tmpfs, сбрасывается при перезагрузке)
RECONNECT_COUNTER_FILE="/run/ltemod/reconnect_count"

# --- Обход блокировок (selective bypass routing) ---
# Включить селективную маршрутизацию (selective/exclude bypass по доменам и IP)
# yes — включить; no — выключить (поведение по умолчанию)
BYPASS_ENABLED="no"

# Режим обхода:
#   selective — заблокированные домены/IP → VPN, остальное → прямой uplink
#               (полный VPN не нужен; VPN-туннель используется только для bypass-трафика)
#   exclude   — заблокированные российские сервисы → прямой uplink, остальное → VPN
#               (при активном full-tunnel VPN обеспечивает работу банков, Госуслуг и т.п.)
BYPASS_MODE="selective"

# Предустановленный список (preset):
#   russia-inside  — домены, заблокированные РКН (подходит для selective)
#   russia-outside — российские сервисы, блокирующие VPN (подходит для exclude)
#   none           — только BYPASS_LIST_URLS (ручные URL)
BYPASS_LIST_PRESET="russia-inside"

# Дополнительные URL со списками (через пробел), поддерживаются форматы:
#   dnsmasq-ipset: ipset=/domain.com/vpn_domains
#   raw IP/CIDR:   один IP или CIDR на строку
BYPASS_LIST_URLS=""

# Таблица политической маршрутизации (номер, не занятый системой)
BYPASS_TABLE="100"

# Firewall-mark для пакетов, которые должны идти через bypass-маршрут
BYPASS_FWMARK="0x64"

# --- Пути ---
# Директория для runtime данных (текущий режим и т.д.)
RUNTIME_DIR="/run/ltemod"

# Файл текущего режима: "direct" | "wg" | "amnezia" | "vless"
MODE_FILE="/run/ltemod/mode"

# Лог-тег для syslog
LOG_TAG="ltemod"
