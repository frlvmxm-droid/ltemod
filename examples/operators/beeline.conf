# =============================================================================
# Билайн — настройки для /etc/ltemod/ltemod.conf
# Скопируй нужные строки в свой конфиг:
#   sudo nano /etc/ltemod/ltemod.conf
# =============================================================================

# APN: основной (интернет)
APN="internet.beeline.ru"
# Альтернативные: "home.beeline.ru" (домашний интернет Билайн),
#                 "beeline.ru"       (некоторые устройства/тарифы)

# Билайн требует авторизацию для некоторых APN
APN_USER="beeline"
APN_PASS="beeline"
# Примечание: если APN "internet.beeline.ru" не работает с логином —
# попробуй оставить APN_USER="" и APN_PASS="" (зависит от тарифа)

# USSD-баланс: *102# — стандарт Билайн
USSD_BALANCE_CODE="*102#"

# Другие полезные USSD:
#   *110*09# — остаток пакета трафика
#   *110*901# — услуги подписок
#   *111# — личный кабинет
