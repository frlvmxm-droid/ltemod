# =============================================================================
# МегаФон — настройки для /etc/ltemod/ltemod.conf
# Скопируй нужные строки в свой конфиг:
#   sudo nano /etc/ltemod/ltemod.conf
# =============================================================================

# APN: основной (работает в большинстве регионов)
APN="internet"
# Альтернативные: "internet.megafon.ru"  (ряд регионов/тарифов),
#                 "gdata"                (некоторые SIM Yota на МегаФон)

# APN не требует логин/пароль — оставить пустыми
# APN_USER=""
# APN_PASS=""

# USSD-баланс: #100# — стандарт МегаФон (с символом # в начале!)
USSD_BALANCE_CODE="#100#"

# Другие полезные USSD:
#   *558# — остаток пакета интернета
#   #507# — личный кабинет
#   *105# — информационное меню
#   *138# — статус услуг
