# =============================================================================
# МТС — настройки для /etc/ltemod/ltemod.conf
# Скопируй нужные строки в свой конфиг:
#   sudo nano /etc/ltemod/ltemod.conf
# =============================================================================

# APN: основной — интернет без авторизации
APN="internet.mts.ru"
# Альтернативные: "internet" (работает на большинстве тарифов),
#                 "mts" (некоторые корпоративные тарифы)

# APN не требует логин/пароль — оставить пустыми
# APN_USER=""
# APN_PASS=""

# USSD-баланс: *100# — стандарт МТС
USSD_BALANCE_CODE="*100#"

# Другие полезные USSD:
#   *111# — личный кабинет
#   *152# — детализация расходов
#   *134# — статус блокировки
