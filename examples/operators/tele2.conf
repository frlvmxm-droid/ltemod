# =============================================================================
# Tele2 — настройки для /etc/ltemod/ltemod.conf
# Скопируй значения в свой конфиг или выполни:
#   sudo sed -i -f examples/operators/tele2.conf /etc/ltemod/ltemod.conf
# =============================================================================

# APN: основной
APN="m.tele2.ru"
# Альтернативные: "internet.tele2.ru" (некоторые регионы),
#                 "internet" (универсальный, работает не везде)

# APN не требует логин/пароль — оставить пустыми
# APN_USER=""
# APN_PASS=""

# USSD-баланс: *100# — стандарт Tele2
USSD_BALANCE_CODE="*100#"

# Другие полезные USSD:
#   *105# — остаток пакетов (интернет/минуты/SMS)
#   *106# — личный кабинет
#   *104# — смена тарифа
