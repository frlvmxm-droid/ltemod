# =============================================================================
# Yota (Йота) — настройки для /etc/ltemod/ltemod.conf
# Скопируй нужные строки в свой конфиг:
#   sudo nano /etc/ltemod/ltemod.conf
# =============================================================================

# Yota работает на сети МегаФон (MVNO)
# APN: единственный официальный
APN="yota.ru"

# APN не требует логин/пароль
# APN_USER=""
# APN_PASS=""

# USSD-баланс: Yota не поддерживает USSD для проверки баланса.
# Управление тарифом — только через приложение или my.yota.ru.
# Оставь пустым или используй запрос остатка трафика (не всегда работает):
USSD_BALANCE_CODE=""

# Примечания:
# - Yota SIM работает только в LTE-режиме (не поддерживает 2G/3G)
# - MODEM_PROTO="mbim" рекомендуется, как и для других операторов
# - Если SIM Yota выдана через МегаФон — может работать APN "internet"
