<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ltemod — Вход</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-blue-400 font-bold text-3xl mb-1">ltemod</div>
      <div class="text-slate-500 text-sm">Веб-конфигуратор роутера</div>
    </div>

    <div class="bg-slate-800 rounded-xl p-8 border border-slate-700">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 px-3 py-2 rounded text-sm
              {% if category == 'error' %}bg-red-900/60 border border-red-700 text-red-300{% else %}bg-blue-900/60 border border-blue-700 text-blue-300{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
        <div class="mb-5">
          <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Пароль</label>
          <input
            type="password"
            id="password"
            name="password"
            autofocus
            autocomplete="current-password"
            class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            placeholder="Введите пароль"
          >
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition-colors"
        >
          Войти
        </button>
      </form>
    </div>

    <div class="text-center mt-6 text-slate-600 text-xs">
      192.168.10.1:8080
    </div>
  </div>
</body>
</html>
